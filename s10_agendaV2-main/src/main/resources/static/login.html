<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Agenda</title>
    <link rel="stylesheet" href="agenda.css">
    <script type="module" src="CommandDispatcher.js"></script>
</head>
<body>
    <script src="utilesVista.js"></script>
    <div class="login-container">
        <h2>Iniciar Sesión</h2>
        <form id="formLogin" action="/usuario/login" method="post" onsubmit="acceder(event);">
            <div class="form-group">
                <label for="nombre">Nombre:</label>
                <input type="text" id="nombre" name="nombre" required>
            </div>
            <div class="form-group">
                <label for="contrasenia">Contraseña:</label>
                <input type="password" id="contrasenia" name="contrasenia" required>
            </div>
            <button type="submit" class="btn-acceder">Acceder</button>
        </form>
    </div>
</body>

<script>
    document.addEventListener('DOMContentLoaded', function () {
        const vistaLogin = CommandDispatcher.registerView('Login', {
            onException: async (msg) => await mostrarMensaje(msg)
        });

        vistaLogin.handler('error', async (mensaje) => await mostrarMensaje(mensaje));
        vistaLogin.handler('loginExitoso', (urlDestino) => window.location.href = urlDestino);

        CommandDispatcher.startView(vistaLogin);
    });

    function acceder(event) {
        event.preventDefault();
        CommandDispatcher.submit('/usuario/login', serializarFormulario('formLogin'));
    }
</script>

</html>
