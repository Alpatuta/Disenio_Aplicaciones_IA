<!DOCTYPE html>
	<html lang="es">
	<head>
		<meta charset="UTF-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0">
		<title>Agenda - Principal</title>
		<link rel="stylesheet" href="agenda.css">
		<script type="module" src="CommandDispatcher.js"></script>
	</head>
	<body>
		<script src="utilesVista.js"></script>
		<div class="sidebar">
			<label id="nombreCompleto"> </label>
			<button onclick="cargarContenido('gestionContactos.html')">Contactos</button>
			<button onclick="cargarContenido('busqueda.html')">Busqueda</button>
			<button onclick="logout()">Salir</button>
		</div>
		<div class="content">
			<iframe id="contenidoFrame" src="gestionContactos.html" frameborder="0"></iframe>
		</div>
		<script>
			document.addEventListener('DOMContentLoaded', function () {
				const spnNombreCompleto = document.getElementById('nombreCompleto');

				const vistaMenu = CommandDispatcher.registerView('Menu', {
					onException: async (msg) => await mostrarMensaje(msg)
				});

				vistaMenu.handler('usuarioNoAutenticado', (urlDestino) => window.location.href = urlDestino);
				vistaMenu.handler('nombreCompleto', (nombreCompleto) => {
					spnNombreCompleto.innerHTML = 'AGENDA DE ' + nombreCompleto.toUpperCase();
				});

				CommandDispatcher.startView(vistaMenu);
				CommandDispatcher.submit('/menu/vistaConectada', {}, 'GET');
			});

			function cargarContenido(pagina) {
				document.getElementById('contenidoFrame').src = pagina;
			}

			function logout() {
				CommandDispatcher.submit('/menu/logout', {});
			}
		</script>
	</body>
	</html>
