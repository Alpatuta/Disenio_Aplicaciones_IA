<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Alta de Cliente</title>
  <link rel="stylesheet" href="altaCliente.css" />
</head>

<body>

  <h1>Alta de Cliente</h1>

  <!-- Formulario -->
  <div class="card">
    <h2>Datos del cliente</h2>

    <!-- Cédula (siempre habilitada al inicio) -->
    <div class="campo">
      <label for="cedula">Cédula</label>
      <input type="text" id="cedula" name="cedula" placeholder="Ej: 12345678" maxlength="12" />
    </div>

    <div class="acciones">
      <button id="btnValidarCedula" class="btn-primary" onclick="validarCedula()">Validar cédula</button>
    </div>

    <hr class="separador" />

    <!-- Nombre y email (deshabilitados al inicio) -->
    <div class="campo">
      <label for="nombre">Nombre</label>
      <input type="text" id="nombre" name="nombre" placeholder="Nombre completo" disabled />
    </div>

    <div class="campo">
      <label for="email">Email</label>
      <input type="email" id="email" name="email" placeholder="correo@ejemplo.com" disabled />
    </div>

    <div class="acciones">
      <button id="btnGuardar" class="btn-success" onclick="guardarCliente()" disabled>Guardar cliente</button>
    </div>
  </div>

  <!-- Tabla de clientes -->
  <div class="card-tabla">
    <h2>Clientes registrados</h2>
    <div id="contenedorTabla">
      <p>Cargando clientes...</p>
    </div>
  </div>

  <!-- Utiles de vista (diálogos) -->
  <script src="../utilesVista.js"></script>

  <!-- CommandDispatcher como módulo -->
  <script type="module">
    import dispatcher from '../CommandDispatcher.js';
    window._dispatcher = dispatcher;   // exponerlo para los onclick inline

    // ── Helpers de UI ─────────────────────────────────────────────────────────

    function habilitarFormularioCompleto(habilitar) {
      document.getElementById('nombre').disabled = !habilitar;
      document.getElementById('email').disabled = !habilitar;
      document.getElementById('btnGuardar').disabled = !habilitar;
    }

    function limpiarFormulario() {
      document.getElementById('cedula').value = '';
      document.getElementById('nombre').value = '';
      document.getElementById('email').value = '';
      habilitarFormularioCompleto(false);
    }

    // ── Handlers de comandos ───────────────────────────────────────────────────

    function mostrarClientes(clientes) {
      const contenedor = document.getElementById('contenedorTabla');
      contenedor.innerHTML = crearTablaDesdeJson(clientes);
    }

    function handleMensaje(mensaje) {
      mostrarMensaje(mensaje);
    }

    /**
     * Comando CEDULA_OK: la cédula es válida y no existe → habilitar nombre/email/guardar
     */
    function handleCedulaOk() {
      habilitarFormularioCompleto(true);
      document.getElementById('nombre').focus();
    }

    /**
     * Comando CEDULA_EXISTE: la cédula pertenece a un cliente existente →
     * mostrar sus datos en los campos (sólo lectura, no habilitar guardar)
     */
    function handleCedulaExiste(cliente) {
      document.getElementById('nombre').value = cliente.nombre ?? '';
      document.getElementById('email').value = cliente.email ?? '';
      // No habilitamos guardar
    }

    /**
     * Comando CLIENTE_AGREGADO: cliente guardado con éxito →
     * actualizar tabla y limpiar pantalla
     */
    function handleClienteAgregado(clientes) {
      mostrarClientes(clientes);
      limpiarFormulario();
    }

    // ── Acciones del usuario (expuestas en window para los onclick) ────────────

    window.validarCedula = function () {
      const cedula = document.getElementById('cedula').value.trim();
      // Limpiar campos antes de cada intento
      document.getElementById('nombre').value = '';
      document.getElementById('email').value = '';
      habilitarFormularioCompleto(false);

      _dispatcher.submit('/altaClienteVerificarCedula', { cedula });
    };

    window.guardarCliente = function () {
      const cedula = document.getElementById('cedula').value.trim();
      const nombre = document.getElementById('nombre').value.trim();
      const email = document.getElementById('email').value.trim();
      _dispatcher.submit('/altaCliente', { cedula, nombre, email });
    };

    // ── Configuración y arranque de la vista ───────────────────────────────────

    const view = _dispatcher.registerView('AltaCliente', {
      urlInicio: '/mostrarClientes',
      onException: (msg) => mostrarMensaje(msg)
    });

    // Comandos del backend
    view.handler('OK', mostrarClientes);
    view.handler('MENSAJE', handleMensaje);
    view.handler('CEDULA_OK', handleCedulaOk);
    view.handler('CEDULA_EXISTE', handleCedulaExiste);
    view.handler('CLIENTE_AGREGADO', handleClienteAgregado);

    _dispatcher.startView(view);
  </script>

</body>

</html>
