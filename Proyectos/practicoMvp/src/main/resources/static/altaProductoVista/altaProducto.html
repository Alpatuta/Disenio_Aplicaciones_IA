<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Alta de Producto</title>
    <link rel="stylesheet" href="altaProducto.css" />
</head>

<body>

    <main class="pagina">
        <header class="encabezado">
            <p class="eyebrow">Gestión de stock</p>
            <h1>Alta de Producto</h1>
            <p class="subtitulo">Registra un producto nuevo, valida el nombre y selecciona un proveedor disponible.</p>
        </header>

        <section class="layout">
            <div class="card formulario">
                <h2>Datos del producto</h2>

                <div class="campo">
                    <label for="nombre">Nombre</label>
                    <input type="text" id="nombre" name="nombre" placeholder="Ej: Café molido" maxlength="50" />
                </div>

                <div class="acciones accion-principal">
                    <button id="btnValidarNombre" class="btn-primary" onclick="validarNombre()">Validar nombre</button>
                </div>

                <hr class="separador" />

                <div class="campo">
                    <label for="precio">Precio</label>
                    <input type="number" id="precio" name="precio" placeholder="0" min="0" step="1" disabled />
                </div>

                <div class="campo">
                    <label for="unidades">Unidades</label>
                    <input type="number" id="unidades" name="unidades" placeholder="0" min="0" step="1" disabled />
                </div>

                <div class="campo">
                    <label for="proveedor">Proveedor</label>
                    <select id="proveedor" name="proveedor" disabled>
                        <option value="">Cargando proveedores...</option>
                    </select>
                </div>

                <div class="acciones">
                    <button id="btnGuardar" class="btn-success" onclick="guardarProducto()" disabled>Guardar
                        producto</button>
                </div>
            </div>

            <div class="panel-tablas">
                <div class="card-tabla">
                    <h2>Productos registrados</h2>
                    <div id="contenedorProductos">
                        <p>Cargando productos...</p>
                    </div>
                </div>

                <div class="card-tabla">
                    <h2>Proveedores disponibles</h2>
                    <div id="contenedorProveedores">
                        <p>Cargando proveedores...</p>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <script src="../utilesVista.js"></script>

    <script type="module">
        import dispatcher from '../CommandDispatcher.js';

        window._dispatcher = dispatcher;

        function habilitarFormularioProducto(habilitar) {
            document.getElementById('precio').disabled = !habilitar;
            document.getElementById('unidades').disabled = !habilitar;
            document.getElementById('proveedor').disabled = !habilitar;
            document.getElementById('btnGuardar').disabled = !habilitar;
        }

        function limpiarFormulario() {
            document.getElementById('nombre').value = '';
            document.getElementById('precio').value = '';
            document.getElementById('unidades').value = '';
            document.getElementById('proveedor').selectedIndex = 0;
            habilitarFormularioProducto(false);
            document.getElementById('nombre').focus();
        }

        function mostrarProductos(productos) {
            document.getElementById('contenedorProductos').innerHTML = crearTablaDesdeJson(productos);
        }

        function mostrarProveedores(proveedores) {
            const contenedor = document.getElementById('contenedorProveedores');
            const select = document.getElementById('proveedor');

            contenedor.innerHTML = crearTablaDesdeJson(proveedores);

            if (!Array.isArray(proveedores) || proveedores.length === 0) {
                select.innerHTML = '<option value="">No hay proveedores disponibles</option>';
                select.disabled = true;
                document.getElementById('btnGuardar').disabled = true;
                return;
            }

            select.innerHTML = '<option value="" selected>Seleccione un proveedor...</option>';
            proveedores.forEach((proveedor) => {
                const option = document.createElement('option');
                option.value = proveedor.nombre ?? '';
                option.textContent = proveedor.nombre ?? '';
                select.appendChild(option);
            });
        }

        function handleMensaje(mensaje) {
            mostrarMensaje(mensaje);
        }

        function handleNombreOk() {
            habilitarFormularioProducto(true);
            document.getElementById('precio').focus();
        }

        function handleProductoAgregado(productos) {
            mostrarProductos(productos);
            limpiarFormulario();
        }

        window.validarNombre = function () {
            const nombre = document.getElementById('nombre').value.trim();
            document.getElementById('precio').value = '';
            document.getElementById('unidades').value = '';
            document.getElementById('proveedor').selectedIndex = 0;
            habilitarFormularioProducto(false);

            _dispatcher.submit('/altaProductoVerificarNombre', { nombre });
        };

        window.guardarProducto = function () {
            const nombre = document.getElementById('nombre').value.trim();
            const precio = document.getElementById('precio').value;
            const unidades = document.getElementById('unidades').value;
            const proveedor = document.getElementById('proveedor').value;

            _dispatcher.submit('/altaProducto', {
                nombre,
                precio: Number(precio),
                unidades: Number(unidades),
                proveedor
            });
        };

        const view = _dispatcher.registerView('AltaProducto', {
            urlInicio: '/mostrarProductosYProveedores',
            onException: (msg) => mostrarMensaje(msg)
        });

        view.handler('OK_PRODUCTOS', mostrarProductos);
        view.handler('OK_PROVEEDORES', mostrarProveedores);
        view.handler('MENSAJE', handleMensaje);
        view.handler('NOMBRE_OK', handleNombreOk);
        view.handler('PRODUCTO_AGREGADO', handleProductoAgregado);

        _dispatcher.startView(view);
    </script>

</body>

</html>
